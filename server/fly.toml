# Fly.io app config for the game server. Deploy from the repo root:
#   fly launch --config server/fly.toml --dockerfile server/Dockerfile --no-deploy
#   fly secrets set DATABASE_URL=… GAME_TICKET_SECRET=… ADMIN_TOKEN=…
#   fly deploy --config server/fly.toml --dockerfile server/Dockerfile
#
# One region, always-on (a world room must keep ticking while players are in
# it; SIGTERM on deploys drains rooms to Postgres first).

app = "monecraft-server"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PERSISTENCE = "postgres"
  MAX_ROOMS = "6"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
