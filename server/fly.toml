# fly.toml app configuration file generated for monecraft-server on 2026-07-04T08:38:49+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'monecraft-server'
# San Jose: the transpacific compromise for a mixed NA/Asia player group —
# NA stays ~60-100 ms while Asia drops from 700+ ms (Chicago) to route-
# dependent 200-400 ms. After a region deploy, verify `fly machine list`
# still shows EXACTLY ONE machine (see docs/deploy.md — two split-brains
# every room) and that no machine lingers in the old region.
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Sized to the 512 MB VM below: ~40 MB/room (headless engines skip the
  # renderer-only light cache) + the Bun runtime. Raise memory and MAX_ROOMS
  # together (docs/deploy.md).
  MAX_ROOMS = '3'
  PERSISTENCE = 'postgres'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
  cpus = 2
  memory_mb = 512
