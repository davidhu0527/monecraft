# fly.toml app configuration file generated for monecraft-server on 2026-07-04T08:38:49+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'monecraft-server'
# Chicago, chosen by MEASURED round-trip latency, not a geography guess.
# sjc looked better on paper for a mixed NA/Asia group but was 3-10x worse
# in production for our players' actual ISP routes: Asia ~2000 ms & NA
# ~200 ms on sjc, vs Asia ~1000 ms & NA ~60 ms on ord. Fly peering/routing
# to sjc is simply poor for these users, so ord wins for BOTH groups — do
# not "fix" this back to a west-coast region on a map hunch; re-measure F3
# rttMs first. After a region deploy, verify `fly machine list` still shows
# EXACTLY ONE machine (see docs/deploy.md — two = split-brains every room)
# and that no machine lingers in the old region.
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Sized to the 512 MB VM below: ~40 MB per dimension engine (headless
  # engines skip the renderer-only light cache) — a room is ~40 MB, ~80 MB
  # while its nether is occupied — plus the Bun runtime. Raise memory and
  # MAX_ROOMS together (docs/deploy.md).
  MAX_ROOMS = '3'
  PERSISTENCE = 'postgres'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '512mb'
  cpus = 2
  memory_mb = 512
